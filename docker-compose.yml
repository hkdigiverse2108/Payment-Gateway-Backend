services:
  # Redis Cache Service
  redis:
    image: redis:alpine
    container_name: payment_gateway_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # Payment Gateway Backend Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: payment_gateway_backend
    ports:
      - "5000:80"
    env_file:
      - .env
    environment:
      - PORT=80
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
    restart: unless-stopped

volumes:
  redis_data:
